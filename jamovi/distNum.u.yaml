title: Comparison of Numeric Variables
name: distNum
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: CollapseBox
    label: Appearance
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: orientation
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: invertVars
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: palette
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: reversePalette
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: ComboBox
                name: theme
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: TextBox
                name: textSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 3
            stretchFactor: 1
            children:
              - type: TextBox
                name: alpha
                format: number
                suffix: '%'
          - type: LayoutBox
            cell:
              column: 1
              row: 3
            stretchFactor: 1
            children:
              - type: ComboBox
                name: legendPos
          - type: LayoutBox
            cell:
              column: 0
              row: 4
            stretchFactor: 1
            children:
              - type: TextBox
                name: lineWidth
                format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 4
            stretchFactor: 1
            children:
              - type: TextBox
                name: pointSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 5
            stretchFactor: 1
            children:
              - type: TextBox
                name: jitterSpread
                format: number
                suffix: '%'
          - type: LayoutBox
            cell:
              column: 1
              row: 5
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showN
          - type: LayoutBox
            cell:
              column: 0
              row: 6
            stretchFactor: 1
            children:
              - type: TextBox
                name: valueLabel
                format: string
          - type: LayoutBox
            cell:
              column: 1
              row: 6
            stretchFactor: 1
            children:
              - type: TextBox
                name: title
                format: string
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: autoSize
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotWidth
                format: number
                suffix: px
                enable: '(!autoSize)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotHeight
                format: number
                suffix: px
                enable: '(!autoSize)'
  - type: Label
    label: Plots to show
    children: []
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showBox
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showViolin
      - type: LayoutBox
        cell:
          column: 0
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showErrorBar
      - type: LayoutBox
        cell:
          column: 1
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showRaincloud
      - type: LayoutBox
        cell:
          column: 0
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showRidge
      - type: LayoutBox
        cell:
          column: 1
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showHist
      - type: LayoutBox
        cell:
          column: 0
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showDensity
      - type: LayoutBox
        cell:
          column: 1
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showEcdf
      - type: LayoutBox
        cell:
          column: 0
          row: 4
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showStrip
      - type: LayoutBox
        cell:
          column: 1
          row: 4
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showBarcode
  - type: CollapseBox
    label: Box plot – settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: boxWidth
                format: number
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxOutliers
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxNotch
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxMean
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxJitter
                enable: (showBox)
  - type: CollapseBox
    label: Violin plot – settings
    collapsed: true
    stretchFactor: 1
