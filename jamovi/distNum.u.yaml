# Comparison of Numeric Variables (distNum): USER INTERFACE, hand-written.
# compilerMode is `tame`: jmc keeps this layout and only adds controls for NEW options (aggressive mode would overwrite it).
# Each control is named after its option in distNum.a.yaml. Layout: LayoutBox with `cell: column/row` makes a two-column grid.
title: Comparison of Numeric Variables
name: distNum
jus: '3.0'
stage: 0
compilerMode: tame
children:
  # 1. Variable list (drag variables into the Variables box).
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  # 2. "Plots to show": one checkbox per plot (two columns).
  - type: Label
    label: Plots to show
    children: []
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showBox
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showViolin
      - type: LayoutBox
        cell:
          column: 0
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showErrorBar
      - type: LayoutBox
        cell:
          column: 1
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showRaincloud
      - type: LayoutBox
        cell:
          column: 0
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showRidge
      - type: LayoutBox
        cell:
          column: 1
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showHist
      - type: LayoutBox
        cell:
          column: 0
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showDensity
      - type: LayoutBox
        cell:
          column: 1
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showEcdf
      - type: LayoutBox
        cell:
          column: 0
          row: 4
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showStrip
      - type: LayoutBox
        cell:
          column: 1
          row: 4
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showBarcode
  # 3. "Settings": everything below configures the plots.
  - type: Label
    label: Settings
    children: []
  # Appearance: options shared by all plots. Open by default.
  - type: CollapseBox
    label: Appearance
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: orientation
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: invertVars
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: colourPalette
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: reversePalette
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: ComboBox
                name: plotTheme
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: TextBox
                name: textSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 3
            stretchFactor: 1
            children:
              - type: TextBox
                name: alpha
                format: number
                suffix: '%'
          - type: LayoutBox
            cell:
              column: 1
              row: 3
            stretchFactor: 1
            children:
              - type: ComboBox
                name: legendPos
          - type: LayoutBox
            cell:
              column: 0
              row: 4
            stretchFactor: 1
            children:
              - type: TextBox
                name: lineWidth
                format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 4
            stretchFactor: 1
            children:
              - type: TextBox
                name: pointSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 5
            stretchFactor: 1
            children:
              - type: TextBox
                name: jitterSpread
                format: number
                suffix: '%'
          - type: LayoutBox
            cell:
              column: 1
              row: 5
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showN
          - type: LayoutBox
            cell:
              column: 0
              row: 6
            stretchFactor: 1
            children:
              - type: TextBox
                name: valueLabel
                format: string
          - type: LayoutBox
            cell:
              column: 1
              row: 6
            stretchFactor: 1
            children:
              - type: TextBox
                name: title
                format: string
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: autoSize
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotWidth
                format: number
                suffix: px
                enable: '(!autoSize)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotHeight
                format: number
                suffix: px
                enable: '(!autoSize)'
  # Settings of the "Box plot" plot (collapsed). Its controls are greyed out while `showBox` is unticked.
  - type: CollapseBox
    label: Box plot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: boxWidth
                format: number
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxOutliers
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxNotch
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxMean
                enable: (showBox)
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: boxJitter
                enable: (showBox)
  # Settings of the "Violin plot" plot (collapsed). Its controls are greyed out while `showViolin` is unticked.
  - type: CollapseBox
    label: Violin plot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: violinWidth
                format: number
                enable: (showViolin)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: violinScale
                enable: (showViolin)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: violinAdjust
                format: number
                enable: (showViolin)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: violinTrim
                enable: (showViolin)
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: ComboBox
                name: violinInner
                enable: (showViolin)
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: violinJitter
                enable: (showViolin)
  # Settings of the "Means and error bars" plot (collapsed). Its controls are greyed out while `showErrorBar` is unticked.
  - type: CollapseBox
    label: Means and error bars
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: ebCenter
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: ebInterval
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: ebLevel
                format: number
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: ebMult
                format: number
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: ebJitter
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: TextBox
                name: ebSize
                format: number
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 0
              row: 3
            stretchFactor: 1
            children:
              - type: TextBox
                name: ebCap
                format: number
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 1
              row: 3
            stretchFactor: 1
            children:
              - type: CheckBox
                name: ebConnect
                enable: (showErrorBar)
          - type: LayoutBox
            cell:
              column: 0
              row: 4
            stretchFactor: 1
            children:
              - type: CheckBox
                name: ebLabels
                enable: (showErrorBar)
  # Settings of the "Raincloud plot" plot (collapsed). Its controls are greyed out while `showRaincloud` is unticked.
  - type: CollapseBox
    label: Raincloud plot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: rcCloudWidth
                format: number
                enable: (showRaincloud)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: rcAdjust
                format: number
                enable: (showRaincloud)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: rcRain
                enable: (showRaincloud)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: rcBox
                enable: (showRaincloud)
  # Settings of the "Ridgeline (density) plot" plot (collapsed). Its controls are greyed out while `showRidge` is unticked.
  - type: CollapseBox
    label: Ridgeline (density) plot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: ridgeOverlap
                format: number
                enable: (showRidge)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: ridgeAdjust
                format: number
                enable: (showRidge)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: ridgeTrim
                enable: (showRidge)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: ridgeMedian
                enable: (showRidge)
  # Settings of the "Histogram" plot (collapsed). Its controls are greyed out while `showHist` is unticked.
  - type: CollapseBox
    label: Histogram
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: histBins
                format: number
                enable: (showHist)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: histStat
                enable: (showHist)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: histDensity
                enable: (showHist)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: histFreeY
                enable: (showHist)
  # Settings of the "Overlaid densities" plot (collapsed). Its controls are greyed out while `showDensity` is unticked.
  - type: CollapseBox
    label: Overlaid densities
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: densAdjust
                format: number
                enable: (showDensity)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: densFilled
                enable: (showDensity)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: densTrim
                enable: (showDensity)
  # Settings of the "Cumulative distribution (ECDF)" plot (collapsed). Its controls are greyed out while `showEcdf` is unticked.
  - type: CollapseBox
    label: Cumulative distribution (ECDF)
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: ecdfMedian
                enable: (showEcdf)
  # Settings of the "Data points (strip plot)" plot (collapsed). Its controls are greyed out while `showStrip` is unticked.
  - type: CollapseBox
    label: Data points (strip plot)
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: stripSummary
                enable: (showStrip)
  # Settings of the "Barcode plot" plot (collapsed). Its controls are greyed out while `showBarcode` is unticked.
  - type: CollapseBox
    label: Barcode plot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: barcodeHeight
                format: number
                enable: (showBarcode)
