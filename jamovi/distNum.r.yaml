---
# Comparison of Numeric Variables (distNum): RESULTS.
# One Image per plot. Each is drawn by the function named in `renderFun` (R/distNum.b.R) from the state saved in .run().
name: distNum
title: Comparison of Numeric Variables
jrs: '1.1'
items:
  # Html note shown above the plots only when something needs explaining (set in .run() of R/distNum.b.R).
  - name: hint
    title: ''
    type: Html
    visible: false
  # IMAGE for the "Box plot" plot. Shown only while `showBox` is ticked; drawn by `.plot_box()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
  - name: plot_box
    title: Box plot
    type: Image
    width: 700
    height: 480
    renderFun: .plot_box
    visible: (showBox)
    requiresData: true
    clearWith:
      - vars
      - orientation
      - invertVars
      - colourPalette
      - reversePalette
      - plotTheme
      - textSize
      - alpha
      - lineWidth
      - pointSize
      - jitterSpread
      - valueLabel
      - title
      - showN
      - legendPos
      - boxWidth
      - boxOutliers
      - boxNotch
      - boxMean
      - boxJitter
    refs:
      - ggplot2
  # IMAGE for the "Violin plot" plot. Shown only while `showViolin` is ticked; drawn by `.plot_violin()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
