      - pointSize
      - jitterSpread
      - valueLabel
      - title
      - showN
      - legendPos
      - violinWidth
      - violinScale
      - violinAdjust
      - violinTrim
      - violinInner
      - violinJitter
    refs:
      - ggplot2
  # IMAGE for the "Means and error bars" plot. Shown only while `showErrorBar` is ticked; drawn by `.plot_errorbar()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
