      - plotTheme
      - textSize
      - alpha
      - lineWidth
      - pointSize
      - jitterSpread
      - valueLabel
      - title
      - showN
      - legendPos
      - ebCenter
      - ebInterval
      - ebLevel
      - ebMult
      - ebJitter
      - ebSize
      - ebCap
      - ebConnect
      - ebLabels
    refs:
      - ggplot2
