# Comparison of Ordinal/Nominal Variables (distOrd): USER INTERFACE, hand-written.
# compilerMode is `tame`: jmc keeps this layout and only adds controls for NEW options (aggressive mode would overwrite it).
# Each control is named after its option in distOrd.a.yaml. Layout: LayoutBox with `cell: column/row` makes a two-column grid.
title: Comparison of Ordinal/Nominal Variables
name: distOrd
jus: '3.0'
stage: 0
compilerMode: tame
children:
  # 1. Variable list (drag variables into the Variables box).
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  # 2. "Plots to show": one checkbox per plot (two columns).
  - type: Label
    label: Plots to show
    children: []
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showBars
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showDiverging
      - type: LayoutBox
        cell:
          column: 0
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showHeat
      - type: LayoutBox
        cell:
          column: 1
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showWaffle
      - type: LayoutBox
        cell:
          column: 0
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showPicto
      - type: LayoutBox
        cell:
          column: 1
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showParliament
      - type: LayoutBox
        cell:
          column: 0
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showProfile
      - type: LayoutBox
        cell:
          column: 1
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showMeans
  # 3. "Settings": everything below configures the plots.
  - type: Label
    label: Settings
    children: []
  # Appearance: options shared by all plots. Open by default.
  - type: CollapseBox
    label: Appearance
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: orientation
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: invertVars
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: colourPalette
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: reversePalette
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: ComboBox
                name: plotTheme
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: TextBox
                name: textSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 3
            stretchFactor: 1
            children:
              - type: ComboBox
                name: sortVars
          - type: LayoutBox
            cell:
              column: 1
              row: 3
            stretchFactor: 1
            children:
              - type: TextBox
                name: decimals
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 4
            stretchFactor: 1
            children:
              - type: ComboBox
                name: legendPos
          - type: LayoutBox
            cell:
              column: 1
              row: 4
            stretchFactor: 1
            children:
              - type: TextBox
                name: legendTitle
                format: string
          - type: LayoutBox
            cell:
              column: 0
              row: 5
            stretchFactor: 1
            children:
              - type: TextBox
                name: title
                format: string
          - type: LayoutBox
            cell:
              column: 1
              row: 5
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showN
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: autoSize
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotWidth
                format: number
                suffix: px
                enable: '(!autoSize)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotHeight
                format: number
                suffix: px
                enable: '(!autoSize)'
  # Settings of the "Stacked bars (100%)" plot (collapsed). Its controls are greyed out while `showBars` is unticked.
  - type: CollapseBox
    label: Stacked bars
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: barWidth
                format: number
                enable: (showBars)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: barLabels
                enable: (showBars)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: barMinLabel
                format: number
                enable: (showBars)
  # Settings of the "Diverging bars (Likert style)" plot (collapsed). Its controls are greyed out while `showDiverging` is unticked.
  - type: CollapseBox
    label: Diverging bars
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: divWidth
                format: number
                enable: (showDiverging)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: divNeutral
                enable: (showDiverging)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: divLabels
                enable: (showDiverging)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: divMinLabel
                format: number
                enable: (showDiverging)
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: divNet
                enable: (showDiverging)
  # Settings of the "Heatmap" plot (collapsed). Its controls are greyed out while `showHeat` is unticked.
  - type: CollapseBox
    label: Heatmap
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: heatPalette
                enable: (showHeat)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: heatLabels
                enable: (showHeat)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: heatGap
                format: number
                enable: (showHeat)
  # Settings of the "Waffle chart" plot (collapsed). Its controls are greyed out while `showWaffle` is unticked.
  - type: CollapseBox
    label: Waffle chart
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleRows
                format: number
                enable: (showWaffle)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleCols
                format: number
                enable: (showWaffle)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleGap
                format: number
                enable: (showWaffle)
  # Settings of the "Dot pictogram" plot (collapsed). Its controls are greyed out while `showPicto` is unticked.
  - type: CollapseBox
    label: Dot pictogram
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoRows
                format: number
                enable: (showPicto)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoCols
                format: number
                enable: (showPicto)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: pictoShape
                enable: (showPicto)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoSize
                format: number
                enable: (showPicto)
  # Settings of the "Parliament (arc) chart" plot (collapsed). Its controls are greyed out while `showParliament` is unticked.
  - type: CollapseBox
    label: Parliament
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlSeats
                format: number
                enable: (showParliament)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlRows
                format: number
                enable: (showParliament)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlSize
                format: number
                enable: (showParliament)
  # Settings of the "Response profile (lines)" plot (collapsed). Its controls are greyed out while `showProfile` is unticked.
  - type: CollapseBox
    label: Response profile
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: profLines
                enable: (showProfile)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: profPoints
                enable: (showProfile)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: profLabels
                enable: (showProfile)
  # Settings of the "Mean category and CI (ordinal or two-category variables)" plot (collapsed). Its controls are greyed out while `showMeans` is unticked.
  - type: CollapseBox
    label: Mean category and CI
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: meansCi
                enable: (showMeans)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: meansLevel
                format: number
                enable: (showMeans)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: meansLabels
                enable: (showMeans)
