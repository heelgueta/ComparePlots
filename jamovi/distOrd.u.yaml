                enable: (showWaffle)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleCols
                format: number
                enable: (showWaffle)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
