title: Comparison of Ordinal/Nominal Variables
name: distOrd
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: Label
    label: Plots to show
    children: []
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showBars
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showDiverging
      - type: LayoutBox
        cell:
          column: 0
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showHeat
      - type: LayoutBox
        cell:
          column: 1
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showWaffle
      - type: LayoutBox
        cell:
          column: 0
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showPicto
      - type: LayoutBox
        cell:
          column: 1
          row: 2
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showParliament
      - type: LayoutBox
        cell:
          column: 0
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showProfile
      - type: LayoutBox
        cell:
          column: 1
          row: 3
        stretchFactor: 1
        children:
          - type: CheckBox
            name: showMeans
  - type: CollapseBox
    label: Appearance
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: orientation
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: invertVars
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: colourPalette
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: reversePalette
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: ComboBox
                name: plotTheme
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: TextBox
                name: textSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 3
            stretchFactor: 1
            children:
              - type: ComboBox
                name: sortVars
          - type: LayoutBox
            cell:
              column: 1
              row: 3
            stretchFactor: 1
            children:
              - type: TextBox
                name: decimals
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 4
            stretchFactor: 1
            children:
              - type: ComboBox
                name: legendPos
          - type: LayoutBox
            cell:
              column: 1
              row: 4
            stretchFactor: 1
            children:
              - type: TextBox
                name: legendTitle
                format: string
          - type: LayoutBox
            cell:
              column: 0
              row: 5
            stretchFactor: 1
            children:
              - type: TextBox
                name: title
                format: string
          - type: LayoutBox
            cell:
              column: 1
              row: 5
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showN
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: autoSize
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotWidth
                format: number
                suffix: px
                enable: '(!autoSize)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: plotHeight
                format: number
                suffix: px
                enable: '(!autoSize)'
  - type: CollapseBox
    label: Stacked bars – settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: barWidth
                format: number
                enable: (showBars)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: barLabels
                enable: (showBars)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: barMinLabel
                format: number
                enable: (showBars)
  - type: CollapseBox
    label: Diverging bars – settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
