title: Compare Ordinal
name: distOrd
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: CollapseBox
    label: Appearance
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: orientation
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: sortVars
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: invertVars
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: colourPalette
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: reversePalette
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: ComboBox
                name: plotTheme
          - type: LayoutBox
            cell:
              column: 0
              row: 3
            stretchFactor: 1
            children:
              - type: TextBox
                name: textSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 4
            stretchFactor: 1
            children:
              - type: CheckBox
                name: useDesc
          - type: LayoutBox
            cell:
              column: 0
              row: 5
            stretchFactor: 1
            children:
              - type: TextBox
                name: decimals
                format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 5
            stretchFactor: 1
            children:
              - type: ComboBox
                name: legendPos
          - type: LayoutBox
            cell:
              column: 0
              row: 6
            stretchFactor: 1
            children:
              - type: TextBox
                name: legendTitle
                format: string
          - type: LayoutBox
            cell:
              column: 1
              row: 6
            stretchFactor: 1
            children:
              - type: TextBox
                name: title
                format: string
          - type: LayoutBox
            cell:
              column: 0
              row: 7
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showN
  - type: CollapseBox
    label: Stacked Bars
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showBars
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: barWidth
                format: number
                suffix: '%'
                enable: (showBars)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: barLabels
                enable: (showBars)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: barMinLabel
                format: number
                suffix: '%'
                enable: (showBars && barLabels)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: alpha
        format: number
  - type: CollapseBox
    label: Diverging Bars
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showDiverging
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: divWidth
                format: number
                suffix: '%'
                enable: (showDiverging)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: divNeutral
                enable: (showDiverging)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: divLabels
                enable: (showDiverging)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: divMinLabel
                format: number
                suffix: '%'
                enable: (showDiverging && divLabels)
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: divNet
                enable: (showDiverging)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: lineWidth
        format: number
  - type: CollapseBox
    label: Heatmap
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showHeat
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: heatPalette
                enable: (showHeat)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: heatLabels
                enable: (showHeat)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: heatGap
                format: number
                suffix: '%'
                enable: (showHeat)
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: ignoreMissing
  - type: CollapseBox
    label: Waffle Chart
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showWaffle
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleRows
                format: number
                enable: (showWaffle)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleCols
                format: number
                enable: (showWaffle)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleGap
                format: number
                suffix: '%'
                enable: (showWaffle)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleGrid
                format: number
                enable: (showWaffle)
  - type: CollapseBox
    label: Dot Pictogram
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showPicto
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoRows
                format: number
                enable: (showPicto)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoCols
                format: number
                enable: (showPicto)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: pictoShape
                enable: (showPicto)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoSize
                format: number
                enable: (showPicto)
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoGrid
                format: number
                enable: (showPicto)
  - type: CollapseBox
    label: Parliament Chart
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showParliament
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlSeats
                format: number
                enable: (showParliament)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlRows
                format: number
                enable: (showParliament)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlSize
                format: number
                enable: (showParliament)
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlGrid
                format: number
                enable: (showParliament)
  - type: CollapseBox
    label: Response Profile
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showProfile
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: profLines
                enable: (showProfile)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: profPoints
                enable: (showProfile)
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: profLabels
                enable: (showProfile)
