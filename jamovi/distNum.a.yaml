---
# Compare Numeric (distNum): OPTIONS.
# Defines every option of the analysis. jmvtools compiles this file (with the .r.yaml) into R/distNum.h.R;
# never edit the .h.R by hand. The user interface is in distNum.u.yaml and the plotting code in R/distNum.b.R.
name: distNum
title: Compare Numeric
category: plots
menuGroup: ComparePlots
version: '1.0.0'
jas: '1.2'
options:
  # DATA AND VARIABLES. `data` is the dataset; `vars` is the list of variables the user drops in.
  - name: data
    type: Data
  - name: vars
    title: Variables
    type: Variables
    suggested:
      - continuous
    permitted:
      - numeric
  # APPEARANCE: options shared by every plot of this analysis.
  # NOTE: do not name an option `theme` or `palette`; jmvcore reserves both for jamovi's global plot settings.
  # Hence `plotTheme` and `colourPalette`. Both default to "jamovi current", which follows the user's
  # global jamovi theme/palette (the `ggtheme` and `theme` arguments of the render functions).
  - name: orientation
    title: Orientation
    type: List
    options:
      - name: horizontal
        title: Horizontal
      - name: vertical
        title: Vertical
    default: horizontal
  - name: sortVars
    title: Order variables by
    type: List
    options:
      - name: none
        title: Entry order
      - name: name
        title: Alphabetical
      - name: median
        title: Median
      - name: mean
        title: Mean
    default: none
  - name: useDesc
    title: Variable descriptions as labels
    type: Bool
    default: false
  - name: transform
    title: Transform values
    type: List
    options:
      - name: none
        title: None
      - name: centre
        title: Centred (mean = 0)
      - name: z
        title: z-scores
      - name: t
        title: T-scores (mean 50, SD 10)
      - name: pomp
        title: Percent of range (0-100)
      - name: percentile
        title: Percentile rank
      - name: log
        title: Natural logarithm
      - name: sqrt
        title: Square root
      - name: square
        title: Square
    default: none
  - name: invertVars
    title: Reverse the order
    type: Bool
    default: false
  - name: colourPalette
    title: Palette
    type: List
    options:
      - name: jamovi
        title: jamovi current
      - name: bw
        title: Black & white (no colour)
      - name: viridis
        title: Viridis
      - name: plasma
        title: Plasma
      - name: magma
        title: Magma
      - name: inferno
        title: Inferno
      - name: cividis
        title: Cividis
      - name: mako
        title: Mako
      - name: rocket
        title: Rocket
      - name: turbo
        title: Turbo
      - name: rdbu
        title: Red–Blue (diverging)
      - name: rdylgn
        title: Red–Yellow–Green (diverging)
      - name: piyg
        title: Pink–Green (diverging)
      - name: prgn
        title: Purple–Green (diverging)
      - name: brbg
        title: Brown–Teal (diverging)
      - name: set2
        title: Set 2
      - name: dark2
        title: Dark 2
      - name: pastel
        title: Pastel 1
      - name: okabe
        title: Okabe–Ito (colour-blind safe)
      - name: grays
        title: Greys
    default: jamovi
  - name: reversePalette
    title: Invert palette
    type: Bool
    default: false
  - name: plotTheme
    title: Theme
    type: List
    options:
      - name: jamovi
        title: jamovi current
      - name: minimal
        title: Minimal
      - name: classic
        title: Classic
      - name: bw
        title: 'Black & white'
      - name: light
        title: Light
      - name: gray
        title: Grey
    default: jamovi
  - name: textSize
    title: Text size
    type: Integer
    min: 8
    max: 32
    default: 16
  - name: alpha
    title: Opacity
    type: Integer
    min: 5
    max: 100
    default: 80
  - name: lineWidth
    title: Line thickness (1–5)
    type: Integer
    min: 1
    max: 5
    default: 2
  - name: pointSize
    title: Point size
    type: Number
    min: 0.2
    max: 6
    default: 1.4
  - name: jitterSpread
    title: Jitter spread
    type: Integer
    min: 0
    max: 100
    default: 40
  - name: valueLabel
    title: Value axis label
    type: String
    default: Value
  - name: title
    title: Plot title
    type: String
    default: ''
  - name: autoFit
    title: Fit plot size to the number of variables
    type: Bool
    default: false
  - name: showN
    title: n per variable
    type: Bool
    default: true
  - name: legendPos
    title: Legend (overlay plots)
    type: List
    options:
      - name: bottom
        title: Bottom
      - name: right
        title: Right
      - name: top
        title: Top
      - name: none
        title: None
    default: bottom
  # PLOT: Box plot. `showBox` switches it on; the options after it are its settings.
  - name: showBox
    title: Box plot
    type: Bool
    default: true
  - name: boxWidth
    title: Box width
    type: Integer
    min: 5
    max: 100
    default: 60
  - name: boxOutliers
    title: Outliers
    type: Bool
    default: true
  - name: boxNotch
    title: Notched (median CI)
    type: Bool
    default: false
  - name: boxMean
    title: Mean marker
    type: Bool
    default: false
  - name: boxJitter
    title: Data points (jittered)
    type: Bool
    default: false
  # PLOT: Violin plot. `showViolin` switches it on; the options after it are its settings.
  - name: showViolin
    title: Violin plot
    type: Bool
    default: false
  - name: violinWidth
    title: Violin width
    type: Integer
    min: 5
    max: 100
    default: 80
  - name: violinScale
    title: Scale
    type: List
    options:
      - name: area
        title: Equal area
      - name: count
        title: By n
      - name: width
        title: Equal width
    default: area
  - name: violinAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: violinTrim
    title: Trim tails at data range
    type: Bool
    default: true
  - name: violinInner
    title: Inner element
    type: List
    options:
      - name: box
        title: Box
      - name: none
        title: None
    default: box
  - name: violinJitter
    title: Data points (jittered)
    type: Bool
    default: false
  # PLOT: Means and error bars. `showErrorBar` switches it on; the options after it are its settings.
  - name: showErrorBar
    title: Means and error bars
    type: Bool
    default: false
  - name: ebCenter
    title: Centre
    type: List
    options:
      - name: mean
        title: Mean
      - name: median
        title: Median
    default: mean
  - name: ebInterval
    title: Error bars
    type: List
    options:
      - name: ci
        title: Confidence interval
      - name: se
        title: Standard error
      - name: sd
        title: Standard deviation
      - name: iqr
        title: Interquartile range
      - name: pctile
        title: 'Central % of the data'
      - name: range
        title: Min–max
    default: ci
  - name: ebLevel
    title: Level for CI / central %
    type: Integer
    min: 50
    max: 99
    default: 95
  - name: ebMult
    title: Multiplier for SE / SD
    type: Number
    min: 0.5
    max: 5
    default: 1
  - name: ebJitter
    title: Data points (jittered)
    type: Bool
    default: true
  - name: ebSize
    title: Marker size
    type: Number
    min: 1
    max: 10
    default: 3.5
  - name: ebCap
    title: Cap width
    type: Integer
    min: 0
    max: 100
    default: 30
  - name: ebConnect
    title: Line connecting the centres
    type: Bool
    default: false
  - name: ebLabels
    title: Centre values
    type: Bool
    default: false
  # PLOT: Raincloud plot. `showRaincloud` switches it on; the options after it are its settings.
  - name: showRaincloud
    title: Raincloud plot
    type: Bool
    default: false
  - name: rcCloudWidth
    title: Cloud height
    type: Integer
    min: 10
    max: 100
    default: 45
  - name: rcAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: rcRain
    title: Rain (data points)
    type: Bool
    default: true
  - name: rcBox
    title: Box
    type: Bool
    default: true
  # PLOT: Ridgeline (density) plot. `showRidge` switches it on; the options after it are its settings.
  - name: showRidge
    title: Ridgeline (density) plot
    type: Bool
    default: false
  - name: ridgeOverlap
    title: Overlap
    type: Integer
    min: 0
    max: 300
    default: 50
  - name: ridgeAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: ridgeTrim
    title: Trim tails at data range
    type: Bool
    default: false
  - name: ridgeMedian
    title: Median marker
    type: Bool
    default: false
  # PLOT: Histogram. `showHist` switches it on; the options after it are its settings.
  - name: showHist
    title: Histogram
    type: Bool
    default: false
  - name: histBins
    title: Number of bins
    type: Integer
    min: 3
    max: 100
    default: 20
  - name: histStat
    title: Bar height
    type: List
    options:
      - name: count
        title: Count
      - name: percent
        title: Percent
      - name: density
        title: Density
    default: count
  - name: histDensity
    title: Add density curve
    type: Bool
    default: false
  - name: histFreeY
    title: Free height scale per variable
    type: Bool
    default: false
  # PLOT: Overlaid densities. `showDensity` switches it on; the options after it are its settings.
  - name: showDensity
    title: Overlaid densities
    type: Bool
    default: false
  - name: densAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: densFilled
    title: Fill under the curves
    type: Bool
    default: true
  - name: densTrim
    title: Trim tails at data range
    type: Bool
    default: false
  # PLOT: Cumulative distribution (ECDF). `showEcdf` switches it on; the options after it are its settings.
  - name: showEcdf
    title: Cumulative distribution (ECDF)
    type: Bool
    default: false
  - name: ecdfMedian
    title: 'Median marker (50%)'
    type: Bool
    default: true
  # PLOT: Data points (strip plot). `showStrip` switches it on; the options after it are its settings.
  - name: showStrip
    title: Data points (strip plot)
    type: Bool
    default: false
  - name: stripSummary
    title: Summary line
    type: List
    options:
      - name: none
        title: None
      - name: mean
        title: Mean
      - name: median
        title: Median
    default: none
  # PLOT: Barcode plot. `showBarcode` switches it on; the options after it are its settings.
  - name: showBarcode
    title: Barcode plot
    type: Bool
    default: false
  - name: barcodeHeight
    title: Tick height
    type: Integer
    min: 10
    max: 100
    default: 70
...
