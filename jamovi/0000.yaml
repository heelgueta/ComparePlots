  variables: stacked and diverging bars, heatmap, waffle, pictogram,
  parliament, response profile and mean-category plots.
analyses:
  - title: Comparison of Numeric Variables
    name: distNum
    ns: ComparePlots
    menuGroup: ComparePlots
    menuTitle: Comparison of Numeric Variables
    menuSubtitle: Box, violin, error bars, raincloud, ridgeline, histogram, ECDF
    description: Compare the distributions of several numeric variables on one shared axis.
  - title: Comparison of Ordinal/Nominal Variables
    name: distOrd
    ns: ComparePlots
    menuGroup: ComparePlots
    menuTitle: Comparison of Ordinal/Nominal Variables
    menuSubtitle: Stacked and diverging bars, heatmap, waffle, profile
    description: Compare the response distributions of several ordinal or nominal variables.
datasets:
  - name: Well-being scales (numeric example)
    path: cp_numeric_example.omv
    description: Six 0-100 scales with different shapes (normal, skewed, bimodal, narrow), n = 240
  - name: Course evaluation (ordinal example)
    path: cp_ordinal_example.omv
    description: Six Likert items with different response patterns, n = 300
  - name: Drink preference (nominal example)
    path: cp_nominal_example.omv
    description: The same five-category nominal variable at three times of day, n = 250
