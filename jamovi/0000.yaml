---
# ComparePlots: module manifest (jamovi reads this; jmvtools extends it at build time).
# Author: Herman E. Elgueta, Departamento de Psicologia, Universidad de Magallanes.
# Developed for the Laboratorio Austral de Medicion Psicosocial (LAMP), Universidad de Magallanes.
# `analyses` is the menu: one entry per analysis (the definitions are in jamovi/<name>.{a,r,u}.yaml).
# `datasets` are the example files offered in jamovi's Data Library (files live in data/).
title: ComparePlots
name: ComparePlots
version: 1.0.0
jms: '1.0'
authors:
  - Herman E. Elgueta
maintainer: Herman E. Elgueta <herman.elgueta@umag.cl>
date: '2026-11-03'
category: plots
type: R
description: >-
  Compare the distributions of several variables on one shared scale. Numeric
  variables: box, violin, means with error bars, raincloud, ridgeline,
  histogram, density, ECDF, data points and barcode plots. Ordinal and nominal
  variables: stacked and diverging bars, heatmap, waffle, pictogram,
  parliament, response profile and mean-category plots.
analyses:
  - title: Compare Numeric
    name: distNum
    ns: ComparePlots
    category: plots
    menuGroup: .
    menuTitle: Compare Numeric
    description: Compare the distributions of several numeric variables on one shared axis.
  - title: Compare Categorical
    name: distOrd
    ns: ComparePlots
    category: plots
    menuGroup: .
    menuTitle: Compare Categorical
    description: Compare the response distributions of several ordinal or nominal variables.
datasets:
  - name: Well-being scales (numeric example)
    path: example_numeric.omv
    description: Six 0-100 scales with different shapes (normal, skewed, bimodal, narrow), n = 240
  - name: Course evaluation (ordinal example)
    path: example_ordinal.omv
    description: Six Likert items with different response patterns, n = 300
  - name: Drink preference (nominal example)
    path: example_nominal.omv
    description: The same five-category nominal variable at three times of day, n = 250
usesNative: true
...
