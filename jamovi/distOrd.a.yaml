---
# Compare Ordinal (distOrd): OPTIONS.
# Defines every option of the analysis. jmvtools compiles this file (with the .r.yaml) into R/distOrd.h.R;
# never edit the .h.R by hand. The user interface is in distOrd.u.yaml and the plotting code in R/distOrd.b.R.
name: distOrd
title: Compare Ordinal
category: plots
menuGroup: comparePlots
version: '1.0.0'
jas: '1.2'
options:
  # DATA AND VARIABLES. `data` is the dataset; `vars` is the list of variables the user drops in.
  - name: data
    type: Data
  - name: vars
    title: Variables
    type: Variables
    suggested:
      - ordinal
      - nominal
    permitted:
      - factor
  # APPEARANCE: options shared by every plot of this analysis.
  # NOTE: do not name an option `theme` or `palette`; jmvcore reserves both for jamovi's global plot settings.
  # Hence `plotTheme` and `colourPalette`. Both default to "jamovi", which follows the user's
  # global jamovi theme/palette (the `ggtheme` and `theme` arguments of the render functions).
  - name: orientation
    title: Orientation
    type: List
    options:
      - name: horizontal
        title: Horizontal
      - name: vertical
        title: Vertical
    default: horizontal
  - name: useDesc
    title: Variable descriptions as labels
    type: Bool
    default: false
  - name: invertVars
    title: Reverse the order
    type: Bool
    default: false
  - name: colourPalette
    title: Palette
    type: List
    options:
      - name: jamovi
        title: jamovi
      - name: viridis
        title: Viridis
      - name: plasma
        title: Plasma
      - name: magma
        title: Magma
      - name: inferno
        title: Inferno
      - name: cividis
        title: Cividis
      - name: mako
        title: Mako
      - name: rocket
        title: Rocket
      - name: turbo
        title: Turbo
      - name: rdbu
        title: Red–Blue
      - name: rdylgn
        title: Red–Yellow–Green
      - name: piyg
        title: Pink–Green
      - name: prgn
        title: Purple–Green
      - name: brbg
        title: Brown–Teal
      - name: pastel
        title: Pastel 1
      - name: okabe
        title: Okabe–Ito
      - name: grays
        title: Greys
    default: jamovi
  - name: reversePalette
    title: Invert palette
    type: Bool
    default: false
  - name: plotTheme
    title: Theme
    type: List
    options:
      - name: jamovi
        title: jamovi
      - name: minimal
        title: Minimal
      - name: classic
        title: Classic
      - name: bw
        title: 'Black & white'
      - name: light
        title: Light
      - name: gray
        title: Grey
    default: jamovi
  - name: textSize
    title: Text size
    type: Integer
    min: 8
    max: 32
    default: 16
  - name: sortVars
    title: Order variables
    type: List
    options:
      - name: none
        title: Entry
      - name: name
        title: A–Z
      - name: mean
        title: Mean
      - name: median
        title: Median
      - name: first
        title: '% first cat.'
      - name: last
        title: '% last cat.'
      - name: net
        title: Net %
    default: none
  - name: decimals
    title: 'Decimals in % labels'
    type: Integer
    min: 0
    max: 3
    default: 0
  - name: legendPos
    title: Legend position
    type: List
    options:
      - name: bottom
        title: Bottom
      - name: right
        title: Right
      - name: top
        title: Top
      - name: none
        title: None
    default: bottom
  - name: legendTitle
    title: Legend title
    type: String
    default: ''
  - name: title
    title: Plot title
    type: String
    default: ''
  - name: alpha
    title: Opacity
    type: Integer
    min: 5
    max: 100
    default: 80
  - name: lineWidth
    title: Line thickness (1–5)
    type: Integer
    min: 1
    max: 5
    default: 2
  - name: ignoreMissing
    title: Ignore missing cases
    type: Bool
    default: true
  - name: showN
    title: n per variable
    type: Bool
    default: false
  # PLOT: Stacked bars (100%). `showBars` switches it on; the options after it are its settings.
  - name: showBars
    title: 'Stacked bars (100%)'
    type: Bool
    default: true
  - name: barWidth
    title: Bar thickness
    type: Integer
    min: 10
    max: 100
    default: 70
  - name: barLabels
    title: '% labels'
    type: Bool
    default: true
  - name: barMinLabel
    title: 'Smallest % to label'
    type: Integer
    min: 0
    max: 50
    default: 5
  # PLOT: Diverging bars (Likert style). `showDiverging` switches it on; the options after it are its settings.
  - name: showDiverging
    title: Diverging bars (Likert style)
    type: Bool
    default: false
  - name: divWidth
    title: Bar thickness
    type: Integer
    min: 10
    max: 100
    default: 70
  - name: divNeutral
    title: Middle category
    type: List
    options:
      - name: auto
        title: Centre
      - name: none
        title: Never centre
    default: auto
  - name: divLabels
    title: '% labels'
    type: Bool
    default: true
  - name: divMinLabel
    title: 'Smallest % to label'
    type: Integer
    min: 0
    max: 50
    default: 8
  - name: divNet
    title: 'Net % on each side'
    type: Bool
    default: false
  # PLOT: Heatmap. `showHeat` switches it on; the options after it are its settings.
  - name: showHeat
    title: Heatmap
    type: Bool
    default: false
  - name: heatPalette
    title: Heatmap colours
    type: List
    options:
      - name: blues
        title: Blues
      - name: greens
        title: Greens
      - name: reds
        title: Reds
      - name: purples
        title: Purples
      - name: oranges
        title: Oranges
      - name: ylorrd
        title: Yellow–Orange–Red
      - name: mako
        title: Mako
      - name: rocket
        title: Rocket
      - name: grays
        title: Greys
    default: blues
  - name: heatLabels
    title: '% in the tiles'
    type: Bool
    default: true
  - name: heatGap
    title: Tile gap
    type: Integer
    min: 0
    max: 40
    default: 4
  # PLOT: Waffle chart. `showWaffle` switches it on; the options after it are its settings.
  - name: showWaffle
    title: Waffle chart
    type: Bool
    default: false
  - name: waffleRows
    title: Rows per chart
    type: Integer
    min: 1
    max: 50
    default: 10
  - name: waffleCols
    title: Columns per chart
    type: Integer
    min: 1
    max: 50
    default: 10
  - name: waffleGap
    title: Gap between squares
    type: Integer
    min: 0
    max: 50
    default: 10
  - name: waffleGrid
    title: Charts per row
    type: Integer
    min: 1
    max: 10
    default: 3
  # PLOT: Dot pictogram. `showPicto` switches it on; the options after it are its settings.
  - name: showPicto
    title: Dot pictogram
    type: Bool
    default: false
  - name: pictoRows
    title: Rows per chart
    type: Integer
    min: 1
    max: 50
    default: 10
  - name: pictoCols
    title: Columns per chart
    type: Integer
    min: 1
    max: 50
    default: 10
  - name: pictoShape
    title: Shape
    type: List
    options:
      - name: circle
        title: Circle
      - name: square
        title: Square
      - name: diamond
        title: Diamond
      - name: triangle
        title: Triangle
    default: circle
  - name: pictoSize
    title: Dot size
    type: Number
    min: 1
    max: 12
    default: 4.5
  - name: pictoGrid
    title: Charts per row
    type: Integer
    min: 1
    max: 10
    default: 3
  # PLOT: Parliament (arc) chart. `showParliament` switches it on; the options after it are its settings.
  - name: showParliament
    title: Parliament (arc) chart
    type: Bool
    default: false
  - name: parlSeats
    title: Number of seats
    type: Integer
    min: 20
    max: 400
    default: 100
  - name: parlRows
    title: Number of rows
    type: Integer
    min: 1
    max: 10
    default: 4
  - name: parlSize
    title: Seat size
    type: Number
    min: 1
    max: 10
    default: 3.2
  - name: parlGrid
    title: Charts per row
    type: Integer
    min: 1
    max: 10
    default: 3
  # PLOT: Response profile (lines). `showProfile` switches it on; the options after it are its settings.
  - name: showProfile
    title: Response profile (lines)
    type: Bool
    default: false
  - name: profLines
    title: Connect with lines
    type: Bool
    default: true
  - name: profPoints
    title: Points
    type: Bool
    default: true
  - name: profLabels
    title: '% values'
    type: Bool
    default: false
...
