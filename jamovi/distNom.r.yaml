---
# Compare Nominal (distNom): RESULTS.
# One Image per plot. Each is drawn by the function named in `renderFun` (R/distNom.b.R) from the state saved in .run().
name: distNom
title: Compare Nominal
jrs: '1.1'
refs:
  - comparePlots
  - ggplot2
items:
  # Html note shown above the plots only when something needs explaining (set in .run() of R/distNom.b.R).
  - name: hint
    title: ''
    type: Html
    visible: false
  # IMAGE for the "Stacked bars (100%)" plot. Shown only while `showBars` is ticked; drawn by `.plot_bars()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
  - name: plot_bars
    title: 'Stacked bars (100%)'
    type: Image
    width: 450
    height: 350
    renderFun: .plot_bars
    visible: (showBars)
    clearWith:
      - vars
      - orientation
      - invertVars
      - colourPalette
      - reversePalette
      - plotTheme
      - textSize
      - sortVars
      - useDesc
      - catSort
      - decimals
      - legendPos
      - legendTitle
      - title
      - showN
      - alpha
      - lineWidth
      - ignoreMissing
      - barWidth
      - barLabels
      - barMinLabel
  # IMAGE for the "Heatmap" plot. Shown only while `showHeat` is ticked; drawn by `.plot_heat()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
  - name: plot_heat
    title: Heatmap
    type: Image
    width: 450
    height: 350
    renderFun: .plot_heat
    visible: (showHeat)
    clearWith:
      - vars
      - orientation
      - invertVars
      - colourPalette
      - reversePalette
      - plotTheme
      - textSize
      - sortVars
      - useDesc
      - catSort
      - decimals
      - legendPos
      - legendTitle
      - title
      - showN
      - alpha
      - lineWidth
      - ignoreMissing
      - heatPalette
      - heatLabels
      - heatGap
  # IMAGE for the "Waffle chart" plot. Shown only while `showWaffle` is ticked; drawn by `.plot_waffle()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
  - name: plot_waffle
    title: Waffle chart
    type: Image
    width: 450
    height: 400
    renderFun: .plot_waffle
    visible: (showWaffle)
    clearWith:
      - waffleGrid
      - vars
      - orientation
      - invertVars
      - colourPalette
      - reversePalette
      - plotTheme
      - textSize
      - sortVars
      - useDesc
      - catSort
      - decimals
      - legendPos
      - legendTitle
      - title
      - showN
      - alpha
      - lineWidth
      - ignoreMissing
      - waffleRows
      - waffleCols
      - waffleGap
  # IMAGE for the "Dot pictogram" plot. Shown only while `showPicto` is ticked; drawn by `.plot_picto()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
  - name: plot_picto
    title: Dot pictogram
    type: Image
    width: 450
    height: 400
    renderFun: .plot_picto
    visible: (showPicto)
    clearWith:
      - pictoGrid
      - vars
      - orientation
      - invertVars
      - colourPalette
      - reversePalette
      - plotTheme
      - textSize
      - sortVars
      - useDesc
      - catSort
      - decimals
      - legendPos
      - legendTitle
      - title
      - showN
      - alpha
      - lineWidth
      - ignoreMissing
      - pictoRows
      - pictoCols
      - pictoShape
      - pictoSize
  # IMAGE for the "Parliament (arc) chart" plot. Shown only while `showParliament` is ticked; drawn by `.plot_parliament()`.
  # clearWith = options that invalidate the image when they change (add new options here too).
  - name: plot_parliament
    title: Parliament (arc) chart
    type: Image
    width: 450
