              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlSeats
                format: number
                enable: '(showParliament)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: parlRows
                format: number
                enable: '(showParliament)'
          - type: LayoutBox
            cell:
              column: 0
