            stretchFactor: 1
            children:
              - type: TextBox
                name: pieMinLabel
                format: number
                suffix: '%'
                enable: '(showPie && pieLabels)'
  - type: CollapseBox
    label: Donut Chart
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showDonut
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: donutHole
                format: number
                suffix: '%'
                enable: '(showDonut)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: donutLabels
                enable: '(showDonut)'
          - type: LayoutBox
            cell:
              column: 0
