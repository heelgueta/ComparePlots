      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleRows
                format: number
                enable: '(showWaffle)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleCols
                format: number
                enable: '(showWaffle)'
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: waffleGap
                format: number
                suffix: '%'
                enable: '(showWaffle)'
  - type: CollapseBox
    label: Dot Pictogram
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showPicto
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoRows
                format: number
                enable: '(showPicto)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoCols
                format: number
                enable: '(showPicto)'
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: pictoShape
                enable: '(showPicto)'
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: pictoSize
                format: number
                enable: '(showPicto)'
  - type: CollapseBox
    label: Parliament Chart
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showParliament
      - type: LayoutBox
        margin: large
