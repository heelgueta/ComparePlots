            stretchFactor: 1
            children:
              - type: TextBox
                name: parlSize
                format: number
                enable: '(showParliament)'
  - type: CollapseBox
    label: Pie Chart
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showPie
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: pieLabels
                enable: '(showPie)'
          - type: LayoutBox
            cell:
              column: 1
