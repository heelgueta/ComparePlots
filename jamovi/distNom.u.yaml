# Compare Nominal (distNom): USER INTERFACE, hand-written.
# compilerMode is `tame`: jmc keeps this layout and only adds controls for NEW options.
# Each plot has its own CollapseBox that holds the plot's checkbox AND its settings; the settings are
# greyed out (enable:) while the checkbox is off, or while a sibling option they depend on is off.
title: Compare Nominal
name: distNom
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  # Appearance: options shared by all plots. Open by default.
  - type: CollapseBox
    label: Appearance
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: orientation
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: sortVars
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: ComboBox
                name: catSort
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: invertVars
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: ComboBox
                name: colourPalette
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: CheckBox
                name: reversePalette
          - type: LayoutBox
            cell:
              column: 0
              row: 3
            stretchFactor: 1
            children:
              - type: ComboBox
                name: plotTheme
          - type: LayoutBox
            cell:
              column: 1
              row: 3
            stretchFactor: 1
            children:
              - type: TextBox
                name: textSize
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 4
            stretchFactor: 1
            children:
              - type: TextBox
                name: gridCols
                format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 4
            stretchFactor: 1
            children:
              - type: CheckBox
                name: useDesc
          - type: LayoutBox
            cell:
              column: 0
              row: 5
            stretchFactor: 1
            children:
              - type: CheckBox
                name: autoFit
          - type: LayoutBox
            cell:
              column: 1
              row: 5
            stretchFactor: 1
            children:
              - type: TextBox
                name: decimals
                format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 6
            stretchFactor: 1
            children:
              - type: ComboBox
                name: legendPos
          - type: LayoutBox
            cell:
              column: 1
              row: 6
            stretchFactor: 1
            children:
              - type: TextBox
                name: legendTitle
                format: string
          - type: LayoutBox
            cell:
              column: 0
              row: 7
            stretchFactor: 1
            children:
              - type: TextBox
                name: title
                format: string
          - type: LayoutBox
            cell:
              column: 1
              row: 7
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showN
  - type: CollapseBox
    label: Stacked Bars
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showBars
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: barWidth
                format: number
                suffix: '%'
                enable: '(showBars)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: barLabels
                enable: '(showBars)'
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: barMinLabel
                format: number
                suffix: '%'
                enable: '(showBars && barLabels)'
  - type: CollapseBox
    label: Heatmap
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showHeat
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: heatPalette
                enable: '(showHeat)'
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: heatLabels
                enable: '(showHeat)'
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: heatGap
                format: number
                suffix: '%'
                enable: '(showHeat)'
  - type: CollapseBox
    label: Waffle Chart
    collapsed: true
    stretchFactor: 1
